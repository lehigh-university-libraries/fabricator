name: lint-test-build-push
on: [push]
permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ">=1.25.3"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest

      - name: Install dependencies
        run: go get .

      - name: Build
        run: shellcheck **/*.sh

      - name: Build
        run: go build

      - name: Test with the Go CLI
        run: go test -v ./...

  build-push:
    needs: [lint-test]
    name: "docker build+push"
    uses: lehigh-university-libraries/gha/.github/workflows/build-push-ghcr.yaml@e26d86abfbe300be4d93570b666651c11471995b # main
    permissions:
      contents: read
      packages: write
    secrets: inherit
